name: Delete Workflows

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE to remove all other workflow files'
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete Other Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DELETE" ]; then
            echo "Confirmation must be exactly: DELETE"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show current workflows
        run: |
          echo "=== Existing workflows ==="

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -print

      - name: Delete other workflows
        run: |
          set -euo pipefail

          KEEP_CLEANUP="cleanup-workflows.yml"

          echo
          echo "Keeping:"
          echo "  $KEEP_CLEANUP"

          echo
          echo "Deleting every other workflow..."

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            ! -name "$KEEP_CLEANUP" \
            -print \
            -delete

          echo
          echo "=== Remaining workflows ==="

          find .github/workflows \
            -maxdepth 1 \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -print

      - name: Commit workflow cleanup
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No workflow files needed deleting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows

          git commit -m "ci: remove unused workflows"

          git push
