name: Clear Workflow Runs

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Keep runs newer than this many days (0 = delete regardless of age)"
        required: true
        default: "0"

      minimum_runs:
        description: "Minimum number of runs to keep per workflow (0 = keep none)"
        required: true
        default: "0"

      workflow_pattern:
        description: "Workflow name or filename to target (leave blank = all workflows)"
        required: false
        default: ""

      workflow_state:
        description: "Target workflows by state"
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - active
          - deleted
          - disabled_fork
          - disabled_inactivity
          - disabled_manually

      conclusion:
        description: "Which workflow runs should be deleted"
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "Unsuccessful"
          - action_required
          - cancelled
          - failure
          - skipped
          - success

      keep_existing_branches:
        description: "Keep runs belonging to branches that still exist"
        required: true
        default: false
        type: boolean

      keep_pull_requests:
        description: "Keep runs associated with pull requests"
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Clear Workflow Runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}

          retain_days: ${{ inputs.days }}
          keep_minimum_runs: ${{ inputs.minimum_runs }}

          delete_workflow_pattern: ${{ inputs.workflow_pattern }}

          delete_workflow_by_state_pattern: >-
            ${{ inputs.workflow_state }}

          delete_run_by_conclusion_pattern: >-
            ${{ 
              inputs.conclusion == 'Unsuccessful'
              && 'action_required,cancelled,failure,skipped'
              || inputs.conclusion
            }}

          check_branch_existence: >-
            ${{ inputs.keep_existing_branches }}

          check_pullrequest_exist: >-
            ${{ inputs.keep_pull_requests }}
